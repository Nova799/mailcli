name: secret-scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Tous les lundis à 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Recherche de credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Scan "app password" (16 chars)
        run: |
          set -euo pipefail
          # Les mots de passe d'application Gmail font 16 caractères (souvent affichés avec espaces)
          if git grep -n -E '\b[a-z0-9]{16}\b' -- . \
              ':(exclude)config.example.json' \
              | grep -v -E 'your-16-char-app-password|your.email@|x@y\.com' ; then
            echo "::error::Motif ressemblant à un mot de passe d'application trouvé"
            exit 1
          fi
          echo "Aucun motif de mot de passe d'application trouvé."

      - name: Vérifie que config.json n'est pas tracké
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)config\.json$'; then
            echo "::error::config.json (credentials) est tracké dans le dépôt"
            exit 1
          fi
          echo "config.json n'est pas tracké."
